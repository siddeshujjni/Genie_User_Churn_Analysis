resources:
  jobs:
    genie_churn_job:
      name: "Genie User Churn Analysis"
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"   # daily at 06:00 UTC
        timezone_id: "UTC"
      tags:
        project: genie_churn_analysis
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../src/notebooks/01_ingest_genie_telemetry.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              data_mode: ${var.data_mode}
              lookback_days: ${var.lookback_days}
              include_conversation_text: ${var.include_conversation_text}
          environment_key: default
        - task_key: gold
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ../src/notebooks/02_build_gold_tables.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              churn_days: ${var.churn_days}
              at_risk_days: ${var.at_risk_days}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"
